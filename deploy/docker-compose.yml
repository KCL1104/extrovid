# extrovid — single-VM production stack for Alibaba Cloud ECS.
# backend + frontend are pulled from ACR; Caddy terminates TLS (auto Let's Encrypt) and
# reverse-proxies, streaming SSE without buffering.
#
# ponytail: ONE backend replica on purpose — the in-process video reconciler has no leader
# election, so a second instance would double-poll every RUNNING job. Do NOT scale `backend`.
#
# On the ECS box (see deploy/README.md):
#   cp .env.example .env && $EDITOR .env
#   docker login registry-intl-vpc.ap-southeast-1.aliyuncs.com   # one-time
#   docker compose up -d
services:
  backend:
    image: ${REGISTRY}/backend:${TAG:-latest}
    env_file: .env
    environment:
      PORT: "8000"
    expose:
      - "8000"
    restart: always
    # single instance — required by the reconciler (intentionally no replicas/deploy block)
    healthcheck:
      # python (always in the image) instead of curl. Gives alembic+uvicorn boot ~3 min grace.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    image: ${REGISTRY}/frontend:${TAG:-latest}
    expose:
      - "3000"
    restart: always

  caddy:
    image: caddy:2
    depends_on:
      backend:
        condition: service_healthy   # don't proxy /api until alembic+uvicorn are up (avoids boot 502s)
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: always

volumes:
  caddy_data:
  caddy_config:
