name: Build & deploy to Alibaba Cloud

# Builds both images, pushes to ACR (Singapore), then SSHes into the ECS box to pull & restart.
# Required GitHub repository secrets:
#   ACR_REGISTRY        e.g. registry-intl.ap-southeast-1.aliyuncs.com   (internet endpoint)
#   ACR_NAMESPACE       e.g. extrovid
#   ACR_USERNAME        ACR access username
#   ACR_PASSWORD        ACR access password
#   NEXT_PUBLIC_API_BASE  e.g. https://app.example.com/api  (baked into the frontend bundle)
#   SSH_HOST            ECS public IP / EIP
#   SSH_USER            e.g. root or a deploy user
#   SSH_KEY             private key (PEM) authorized on the box
#   SSH_PORT            (optional) defaults to 22
#   DEPLOY_PATH         (optional) defaults to /opt/extrovid

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # false: never cancel an in-flight SSH deploy mid 'docker compose up' (single box, no rollback).
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/backend:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE=${{ secrets.NEXT_PUBLIC_API_BASE }}
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/frontend:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy on ECS over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/extrovid' }}
            export TAG=${{ github.sha }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
